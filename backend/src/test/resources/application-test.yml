# Use an isolated in-memory H2 database and enable signup for integration tests.
spring:
  datasource:
    url: jdbc:h2:mem:campus-tests;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
campus:
  export:
    worker-enabled: false
  registration-enabled: true
  # Legacy workflow suite shares one peer IP; focused abuse tests override these.
  auth-abuse:
    login-ip:
      capacity: 1000
    registration-ip:
      capacity: 1000
    csrf-ip:
      capacity: 1000
  mail:
    worker-enabled: false
    public-origin: http://localhost:8080
    sender: capture@example.test
    key-id: local-test-only
    encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  verification:
    rate-limit-secret: test-only-verification-rate-secret
    rate-limits-enabled: false

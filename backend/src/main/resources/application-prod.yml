# Production overrides require external database credentials and default to secure cookies with signup disabled.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
server:
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:true}
campus:
  registration-enabled: ${REGISTRATION_ENABLED:false}

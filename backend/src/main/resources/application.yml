# Local defaults: file-backed H2, schema validation, session cookies, and optional registration.
spring:
  application:
    name: campus-tracker
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # Local capture SMTP only; run a capture server on loopback before registering.
  mail:
    host: ${SMTP_HOST:127.0.0.1}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 20000
      mail.smtp.writetimeout: 20000
# Keep local accounts in a file; H2_PASSWORD can override the default empty database password.
  datasource:
    url: jdbc:h2:file:./data/campus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ${H2_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}
      connection-timeout: ${DATABASE_ACQUIRE_TIMEOUT_MS:3000}
      validation-timeout: ${DATABASE_VALIDATE_TIMEOUT_MS:2000}
# Let Flyway own schema changes; Hibernate checks mappings rather than changing tables.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
# Reject unknown JSON fields, including attempts to submit server-owned metadata.
  jackson:
    deserialization:
      fail-on-unknown-properties: true
# Bind locally by default and configure the server-side session and cookie policy.
server:
  shutdown: graceful
  tomcat:
    connection-timeout: ${HTTP_CONNECTION_TIMEOUT:5s}
    keep-alive-timeout: ${HTTP_KEEP_ALIVE_TIMEOUT:15s}
    threads:
      max: ${HTTP_MAX_THREADS:100}
      min-spare: ${HTTP_MIN_THREADS:10}
    accept-count: ${HTTP_ACCEPT_COUNT:100}
  forward-headers-strategy: NONE
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
# Do not include internal exception messages or stack traces in default error responses.
  error:
    include-message: never
    include-stacktrace: never
# Allow demo signup locally; the production profile changes this default.
campus:
  export:
    worker-enabled: ${EXPORT_WORKER_ENABLED:false}
    storage: ${EXPORT_STORAGE:file}
    file-root: ${EXPORT_FILE_ROOT:./data/exports}
    spool-root: ${EXPORT_SPOOL_ROOT:./data/export-spool}
    max-downloads: ${EXPORT_MAX_DOWNLOADS:4}
    s3:
      bucket: ${EXPORT_S3_BUCKET:}
      region: ${AWS_REGION:us-east-1}
      endpoint: ${EXPORT_S3_ENDPOINT:}
      path-style: ${EXPORT_S3_PATH_STYLE:false}
      allow-insecure-endpoint: ${EXPORT_S3_ALLOW_INSECURE_ENDPOINT:false}
  operations:
    metrics-token: ${METRICS_TOKEN:}
  registration-enabled: ${REGISTRATION_ENABLED:true}
  auth-abuse:
    maximum-keys: ${AUTH_MAXIMUM_KEYS:10000}
    maximum-active: ${AUTH_MAXIMUM_ACTIVE:2}
    login-ip:
      capacity: 20
      refill-period: 1m
    login-email:
      capacity: 10
      refill-period: 10m
    registration-ip:
      capacity: 3
      refill-period: 1h
    csrf-ip:
      capacity: 60
      refill-period: 1m
  mail:
    public-origin: ${PUBLIC_ORIGIN:http://127.0.0.1:8080}
    sender: ${MAIL_SENDER:campus@localhost.test}
    # Synthetic development key. Production requires external secrets and rejects this key.
    key-id: ${OUTBOX_KEY_ID:local-capture-only}
    encryption-key: ${OUTBOX_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    production: false
    worker-enabled: ${MAIL_WORKER_ENABLED:true}
  verification:
    token-ttl: ${VERIFICATION_TOKEN_TTL:24h}
    rate-limit-secret: ${VERIFICATION_RATE_LIMIT_SECRET:local-development-rate-limit-secret}
    rate-limits-enabled: ${VERIFICATION_RATE_LIMITS_ENABLED:true}
    global-mail-daily-limit: ${VERIFICATION_GLOBAL_MAIL_DAILY_LIMIT:1000}

# Probe responses disclose only aggregate status. SMTP is not a web readiness dependency.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          additional-path: server:/livez
        readiness:
          include: readinessState,db
          additional-path: server:/readyz

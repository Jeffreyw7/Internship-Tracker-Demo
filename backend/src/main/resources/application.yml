# Local defaults: file-backed H2, schema validation, session cookies, and optional registration.
spring:
  application:
    name: campus-tracker
  # Local capture SMTP only; run a capture server on loopback before registering.
  mail:
    host: ${SMTP_HOST:127.0.0.1}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 20000
      mail.smtp.writetimeout: 20000
# Keep local accounts in a file; H2_PASSWORD can override the default empty database password.
  datasource:
    url: jdbc:h2:file:./data/campus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ${H2_PASSWORD:}
# Let Flyway own schema changes; Hibernate checks mappings rather than changing tables.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
# Reject unknown JSON fields, including attempts to submit server-owned metadata.
  jackson:
    deserialization:
      fail-on-unknown-properties: true
# Bind locally by default and configure the server-side session and cookie policy.
server:
  forward-headers-strategy: NONE
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
# Do not include internal exception messages or stack traces in default error responses.
  error:
    include-message: never
    include-stacktrace: never
# Allow demo signup locally; the production profile changes this default.
campus:
  registration-enabled: ${REGISTRATION_ENABLED:true}
  # Tighten these import ceilings when needed; startup rejects increases or nonpositive values.
  imports:
    file-bytes: 2097152
    options-bytes: 262144
    request-bytes: 3145728
    data-records: 500
    source-columns: 32
    cell-bytes: 65536
    header-bytes: 256
    preview-work-ms: 30000
    parse-work-ms: 10000
    upload-read-ms: 5000
    process-preview-count: 4
  auth-abuse:
    maximum-keys: 10000
    maximum-active: 2
    login-ip:
      capacity: 20
      refill-period: 1m
    login-email:
      capacity: 10
      refill-period: 10m
    registration-ip:
      capacity: 3
      refill-period: 1h
    csrf-ip:
      capacity: 60
      refill-period: 1m
  mail:
    public-origin: ${PUBLIC_ORIGIN:http://127.0.0.1:8080}
    sender: ${MAIL_SENDER:campus@localhost.test}
    # Synthetic development key. Production requires external secrets and rejects this key.
    key-id: ${OUTBOX_KEY_ID:local-capture-only}
    encryption-key: ${OUTBOX_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    production: false
    worker-enabled: ${MAIL_WORKER_ENABLED:true}
  verification:
    token-ttl: ${VERIFICATION_TOKEN_TTL:24h}
    rate-limit-secret: ${VERIFICATION_RATE_LIMIT_SECRET:local-development-rate-limit-secret}
    rate-limits-enabled: ${VERIFICATION_RATE_LIMITS_ENABLED:true}

# Runs the Java application with PostgreSQL for local development.
services:
# Persist PostgreSQL data in a named volume and wait until the database is ready.
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: campus
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    # Keep database storage across container restarts.
    volumes:
      - campus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 5s
      retries: 10
# Publish only on loopback; local HTTP uses non-secure cookies and enables demo signup.
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://database:5432/campus
      DATABASE_USERNAME: campus
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      COOKIE_SECURE: "false"
      REGISTRATION_ENABLED: "true"
    depends_on:
      database:
        condition: service_healthy
volumes:
  campus-postgres:

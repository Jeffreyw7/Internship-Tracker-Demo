# Runs the Java application with PostgreSQL for local development.
services:
# Persist PostgreSQL data in a named volume and wait until the database is ready.
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: campus
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    # Keep database storage across container restarts.
    volumes:
      - campus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 5s
      retries: 10
# Capture verification email locally. The web inbox is available only on loopback.
  mail:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:8025:8025"
# Publish only on loopback; local HTTP uses non-secure cookies and enables demo signup.
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://database:5432/campus
      DATABASE_USERNAME: campus
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      COOKIE_SECURE: "false"
      REGISTRATION_ENABLED: "true"
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
      PUBLIC_ORIGIN: http://127.0.0.1:8080
      MAIL_SENDER: campus@localhost.test
      OUTBOX_KEY_ID: compose-local-capture
      OUTBOX_ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      VERIFICATION_RATE_LIMIT_SECRET: compose-local-verification-rate-secret
      CAMPUS_MAIL_PRODUCTION: "false"
    depends_on:
      database:
        condition: service_healthy
      mail:
        condition: service_started
volumes:
  campus-postgres:

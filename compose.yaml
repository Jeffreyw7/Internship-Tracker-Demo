# Runs the Java application with PostgreSQL for local development.
services:
  # Optional shared store; activate with --profile distributed and the distributed app profile.
  redis:
    profiles: [distributed]
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD for distributed mode}
      REDIS_MAX_MEMORY: ${REDIS_MAX_MEMORY:-256mb}
    command: ["sh", "-ec", "exec redis-server --maxmemory \"$$REDIS_MAX_MEMORY\" --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
# Persist PostgreSQL data in a named volume and wait until the database is ready.
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: campus
      POSTGRES_USER: ${DATABASE_ADMIN_USERNAME:-campus_admin}
      POSTGRES_PASSWORD: ${DATABASE_ADMIN_PASSWORD:?Set DATABASE_ADMIN_PASSWORD in .env}
      MIGRATION_DATABASE_PASSWORD: ${MIGRATION_DATABASE_PASSWORD:?Set MIGRATION_DATABASE_PASSWORD in .env}
      RUNTIME_DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      MAIL_WORKER_DATABASE_PASSWORD: ${MAIL_WORKER_DATABASE_PASSWORD:?Set MAIL_WORKER_DATABASE_PASSWORD in .env}
      EXPORT_WORKER_DATABASE_PASSWORD: ${EXPORT_WORKER_DATABASE_PASSWORD:?Set EXPORT_WORKER_DATABASE_PASSWORD in .env}
    # Keep database storage across container restarts.
    volumes:
      - campus-postgres:/var/lib/postgresql/data
      - ./deploy/postgres:/opt/campus/postgres:ro
      - ./deploy/postgres/10-provision.sh:/docker-entrypoint-initdb.d/10-provision.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d campus"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      target: migrate
    environment:
      MIGRATION_DATABASE_URL: jdbc:postgresql://database:5432/campus
      MIGRATION_DATABASE_USERNAME: campus_migrator
      MIGRATION_DATABASE_PASSWORD: ${MIGRATION_DATABASE_PASSWORD:?Set MIGRATION_DATABASE_PASSWORD in .env}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
# Capture verification email locally. The web inbox is available only on loopback.
  mail:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:8025:8025"
# Publish only on loopback; local HTTP uses non-secure cookies and enables demo signup.
  app:
    build:
      context: .
      target: app
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SESSION_NAMESPACE: ${SESSION_NAMESPACE:-campus:compose:session:v1}
      AUTH_ADMISSION_NAMESPACE: ${AUTH_ADMISSION_NAMESPACE:-campus:compose:admission:v1}
      AUTH_ADMISSION_HMAC_SECRET: ${AUTH_ADMISSION_HMAC_SECRET:-}
      DATABASE_URL: jdbc:postgresql://database:5432/campus
      DATABASE_USERNAME: campus_runtime
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      COOKIE_SECURE: "false"
      REGISTRATION_ENABLED: "true"
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
      PUBLIC_ORIGIN: http://127.0.0.1:8080
      MAIL_SENDER: campus@localhost.test
      OUTBOX_KEY_ID: compose-local-capture
      OUTBOX_ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      VERIFICATION_RATE_LIMIT_SECRET: compose-local-verification-rate-secret
      CAMPUS_MAIL_PRODUCTION: "false"
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mail:
        condition: service_started
      redis:
        condition: service_healthy
        required: false
volumes:
  campus-postgres:

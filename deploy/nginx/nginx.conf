worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Route templates only: query strings, tokens, cookies and bodies are not logged.
    log_format safe '$request_method $uri $status $request_time';
    access_log /dev/stdout safe;
    error_log /dev/stderr warn;
    sendfile on;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream campus {
        zone campus 64k;
        server api-a:8080 resolve max_fails=1 fail_timeout=3s;
        server api-b:8080 resolve max_fails=1 fail_timeout=3s;
        keepalive 16;
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 256k;
        client_body_timeout 10s;
        keepalive_timeout 15s;
        # Public ingress never exposes management, including slash variations.
        location ~ ^/actuator(?:/|$) { return 404; }
        location ~ ^/(?:api(?:/|$)|livez$|readyz$) {
            proxy_pass http://campus;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 25s;
            proxy_buffering off;
            proxy_cache off;
            # A failed write is ambiguous. Never resend it to another peer.
            proxy_next_upstream off;
            proxy_intercept_errors off;
            # Private addresses are diagnostic labels for the disposable deployment.
            add_header X-Campus-Instance $upstream_addr always;
        }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }
}
